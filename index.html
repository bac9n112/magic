<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кто сегодня будет охранять сон Лизы</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Marck+Script&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 45%, #163a4a 100%);
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .aurora {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(138, 43, 226, 0.25), transparent 40%),
                  radial-gradient(circle at 70% 60%, rgba(0, 255, 170, 0.18), transparent 45%);
      animation: drift 12s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-4%, 4%) rotate(5deg); }
    }

    .fireflies {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .firefly {
      position: absolute;
      border-radius: 50%;
      background: #fff59d;
      box-shadow: 0 0 12px #ffd54f, 0 0 20px #ff80ab;
      animation: floatUp infinite ease-in-out;
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0) scale(0.7); opacity: 0.2; }
      50% { transform: translateY(-25px) scale(1.2); opacity: 0.95; }
    }

    .main-title {
      position: relative;
      z-index: 10;
      font-family: 'Marck Script', cursive;
      font-size: 56px;
      font-weight: normal;
      color: #fff8e7;
      margin: 0 0 85px 0;
      padding: 0 20px;
      text-align: center;
      text-shadow: 
        0 0 12px rgba(127, 255, 212, 0.7),
        0 0 25px rgba(218, 112, 214, 0.7),
        0 4px 10px rgba(0, 0, 0, 0.8);
      letter-spacing: 1px;
      user-select: none;
    }

    .scene {
      position: relative;
      z-index: 5;
      width: 220px;
      height: 220px;
      perspective: 750px;
      margin-bottom: 85px;
      cursor: pointer;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      width: 220px;
      height: 220px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(240, 235, 255, 0.9));
      border: 4px solid #b388ff;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      box-sizing: border-box;
      font-size: 22px;
      font-weight: 800;
      color: #2e1a47;
      box-shadow: inset 0 0 25px rgba(179, 136, 255, 0.4), 0 0 20px rgba(124, 77, 255, 0.4);
      user-select: none;
    }

    .front  { transform: rotateY(  0deg) translateZ(110px); }
    .back   { transform: rotateY(180deg) translateZ(110px); }
    .right  { transform: rotateY( 90deg) translateZ(110px); }
    .left   { transform: rotateY(-90deg) translateZ(110px); }
    .top    { transform: rotateX( 90deg) translateZ(110px); }
    .bottom { transform: rotateX(-90deg) translateZ(110px); }

    button {
      position: relative;
      z-index: 10;
      padding: 18px 48px;
      font-family: 'Nunito', sans-serif;
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #00bfa5 0%, #7c4dff 100%);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 191, 165, 0.45), 0 6px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 0 28px rgba(0, 191, 165, 0.75), 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="aurora"></div>
  <div class="fireflies" id="fireflies"></div>

  <h1 class="main-title">✨ Кто сегодня будет охранять сон Лизы ✨</h1>

  <div class="scene" onclick="rollDice()">
    <div class="cube" id="cube">
      <div class="face front" id="face-0"></div>
      <div class="face back" id="face-1"></div>
      <div class="face right" id="face-2"></div>
      <div class="face left" id="face-3"></div>
      <div class="face top" id="face-4"></div>
      <div class="face bottom" id="face-5"></div>
    </div>
  </div>

  <button onclick="rollDice()">Бросить кубик 🌙</button>

  <script>
    // === НАСТРОЙКИ ===
    const ANIMATION_SECONDS = 11.5; // Время анимации в секундах

    // 20 вариантов (при каждом открытии страницы выбираются 6 случайных)
    const sidesText = [
      "Плюшевый мишка 🧸",
      "Волшебный единорог 🦄",
      "Добрая фея снов 🧚‍♀️",
      "Маленький дракончик 🐉",
      "Умный совёнок 🦉",
      "Пушистый котёнок 🐱",
      "Звёздный зайчонок 🐰",
      "Золотая рыбка 🐠",
      "Розовый фламинго 🦩",
      "Белый медвежонок 🐻‍❄️",
      "Весёлый щенок 🐶",
      "Хранитель луны 🌙",
      "Снежный барсик 🐆",
      "Радужная бабочка 🦋",
      "Лесной оленёнок 🦌",
      "Морская русалочка 🧜‍♀️",
      "Облачный ангелочек 👼",
      "Сказочный пегас 🪽",
      "Маленький лисёнок 🦊",
      "Светлячок-волшебник ✨"
    ];
    // =================

    const cube = document.getElementById('cube');
    cube.style.transition = `transform ${ANIMATION_SECONDS}s cubic-bezier(0.2, 0.8, 0.3, 1)`;

    // Функция случайного перемешивания списка
    function getRandomSix(items) {
      const shuffled = [...items];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled.slice(0, 6);
    }

    // Выбираем 6 случайных пунктов и размещаем их на гранях кубика
    const selectedSides = getRandomSix(sidesText);
    selectedSides.forEach((text, index) => {
      document.getElementById(`face-${index}`).innerText = text;
    });

    const firefliesContainer = document.getElementById('fireflies');
    for (let i = 0; i < 45; i++) {
      const fly = document.createElement('div');
      fly.className = 'firefly';
      const size = Math.random() * 5 + 3;
      fly.style.width = `${size}px`;
      fly.style.height = `${size}px`;
      fly.style.left = `${Math.random() * 100}%`;
      fly.style.top = `${Math.random() * 100}%`;
      fly.style.animationDuration = `${Math.random() * 4 + 3}s`;
      fly.style.animationDelay = `${Math.random() * 4}s`;
      firefliesContainer.appendChild(fly);
    }

    const rotations = [
      { x: 0,   y: 0 },
      { x: 0,   y: 180 },
      { x: 0,   y: -90 },
      { x: 0,   y: 90 },
      { x: -90, y: 0 },
      { x: 90,  y: 0 }
    ];

    let totalX = 0;
    let totalY = 0;

    function rollDice() {
      const randomIndex = Math.floor(Math.random() * 6);
      const target = rotations[randomIndex];

      const spins = Math.max(2, Math.round(ANIMATION_SECONDS * 2));
      const extraSpinsX = (Math.floor(Math.random() * 2) + spins) * 360;
      const extraSpinsY = (Math.floor(Math.random() * 2) + spins) * 360;

      totalX += extraSpinsX + (target.x - (totalX % 360));
      totalY += extraSpinsY + (target.y - (totalY % 360));

      cube.style.transform = `rotateX(${totalX}deg) rotateY(${totalY}deg)`;
    }
  </script>

</body>
</html>
